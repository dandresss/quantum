function getJSON(url,opts){return fetch(url,opts).then(function(r){return r.json().then(function(b){
if(!r.ok)throw new Error(r.status===422?"Ajustes inválidos: ancho y alto entre 2 y 15.":"Error "+r.status);return b})})}
window.startGame=function(){
var my=++run;
dlg.hidden=true;s3.classList.remove("on");s4.classList.add("on");
var f=form.elements,params=new URLSearchParams(new FormData(form));
document.getElementById("info").textContent=f.algorithm.selectedOptions[0].text+" · "+f.braid.selectedOptions[0].text+" · "+f.width.value+"×"+f.height.value;
msg.hidden=false;msg.textContent="Generando…";canvas.hidden=true;cat.toggleAttribute("hidden",true);
getJSON("/api/maze?"+params).then(function(b){
if(my!==run)return;
canvas.hidden=false;drawMaze(b.grid);
msg.textContent="El gato blanco está aprendiendo el laberinto…";
return getJSON("/api/bot/play",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({grid:b.grid})})
.then(function(res){if(my===run)animate(res,my)})})
.catch(function(err){if(my===run){msg.hidden=false;msg.textContent=err.message}})};
document.getElementById("play").addEventListener("click",function(){window.startStory&&window.startStory()});
/* el bot recorre su trayectoria; las celdas repetidas son choques contra una pared */
function animate(res,my){
var ctx=canvas.getContext("2d"),path=res.path,i=0;
cat.toggleAttribute("hidden",false);
(function tick(){
if(my!==run)return;
var p=path[i],scale=canvas.clientWidth/canvas.width,w=cell*scale;
if(i>0){var q=path[i-1];ctx.fillStyle="rgba(255,255,255,.18)";ctx.fillRect(q[1]*cell,q[0]*cell,cell,cell)}
cat.style.width=w+"px";cat.style.height=(w*26/22)+"px";
cat.style.transform="translate("+(4+p[1]*w)+"px,"+(4+(p[0]+1)*w-w*26/22)+"px)";
msg.textContent="Intentando escapar… paso "+i+" / "+res.steps;
if(++i<path.length)setTimeout(tick,res.tick_ms/speed);
else msg.textContent=res.reached?"¡El gato blanco escapó en "+res.steps+" pasos!":"No logró escapar tras "+res.steps+" pasos.";
})()}
function drawMaze(grid){
var rows=grid.length,cols=grid[0].length,
size=Math.max(3,Math.floor(Math.min((Math.min(innerWidth,900)-40)/cols,(innerHeight-120)/rows)));
cell=size;canvas.width=cols*size;canvas.height=rows*size;
var ctx=canvas.getContext("2d");
grid.forEach(function(row,r){row.forEach(function(v,c){ctx.fillStyle=v?"#cdbf9f":"#4a3320";ctx.fillRect(c*size,r*size,size,size);
if(v){ctx.fillStyle="#8f8166";ctx.fillRect(c*size,r*size+size-Math.ceil(size/5),size,Math.ceil(size/5))}})});
/* inicio (arriba-izquierda) y meta (abajo-derecha) */
ctx.fillStyle="#ffc83d";ctx.fillRect(size,size,size,size);
ctx.fillStyle="#f0845a";ctx.fillRect((cols-2)*size,(rows-2)*size,size,size)}

function synth(c){var t=c.currentTime,o=c.createOscillator(),lfo=c.createOscillator(),lg=c.createGain(),f1=c.createBiquadFilter(),f2=c.createBiquadFilter(),g=c.createGain(),m=c.createGain();
o.type="sawtooth";o.frequency.setValueAtTime(430,t);o.frequency.linearRampToValueAtTime(860,t+.2);o.frequency.linearRampToValueAtTime(600,t+.55);o.frequency.linearRampToValueAtTime(400,t+.95);

m.gain.value=1.8;o.connect(f1);o.connect(f2);f1.connect(g);f2.connect(g);g.connect(m);m.connect(c.destination);
o.start(t);lfo.start(t);o.stop(t+1.05);lfo.stop(t+1.05)}
function tryMeow(){if(played||gone||!ctx||ctx.state!=="running")return false;played=true;synth(ctx);hint.hidden=true;return true}
